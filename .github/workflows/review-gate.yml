# 審查紀錄檢查（spec.md 12.1、第 13 節；review-process.md 第 4 節；EQ-5、EQ-11）
# 結果以 commit status（context: review-record）寫回 PR 最新 head SHA。
#
# 安全要求：
# - pull_request_target／issue_comment 有寫入權杖：只簽出預設分支並執行其上的腳本，
#   不簽出、不執行 PR 的程式碼；不 npm install、不使用快取。
# - 不在 run: 中插值任何事件內容；PR 編號以 env: 傳入，其餘由腳本經 API 重新讀取。
# - 本工作流程只在預設分支上的版本生效（加入它的 PR 不受它把關，見 spec.md 12.6 步驟 4、6b）。
name: review-gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  statuses: write
  pull-requests: read
  issues: read
  contents: read

concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review-gate:
    name: review-gate
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: node scripts/review-gate.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

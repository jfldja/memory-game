# CI（spec.md 12.1、12.2.1、12.3；EQ-3、EQ-4、NFR-1）
# 必要檢查名稱：unit、acceptance-ids、e2e (chromium)、e2e (firefox)、e2e (webkit)
# 安全：不在 run: 中以 ${{ }} 插值任何使用者可控的事件內容；只以 env: 傳入 SHA 與矩陣值。
# 逾時與執行環境（spec.md 12.7.4，DQ-15）：unit、acceptance-ids 10 分鐘、ubuntu-26.04；
# e2e 30 分鐘、macos-15，install step 10 分鐘。逾時時重跑失敗的 job，不移除必要檢查、不讓失敗的 step 被視為成功。
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: unit
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # 以引號傳 glob：Node.js 22 傳入目錄會以「Cannot find module」失敗（spec.md 12.1）
      # 模組單元測試與驗收測試分兩次執行，以取得只含驗收測試的結果檔；執行的測試集合不變
      - name: unit tests
        run: node --test 'tests/unit/**/*.test.mjs'
      # 驗收測試（無瀏覽器層）：spec reporter 給人看，自訂 reporter 輸出結果檔（spec.md 12.2.1）。
      # --test-reporter-destination 的目錄必須先存在
      - name: acceptance tests (unit layer)
        run: |
          mkdir -p acceptance-results
          node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/acceptance-reporter.mjs --test-reporter-destination=acceptance-results/unit.jsonl 'tests/acceptance/unit/**/*.test.mjs'
      - name: acceptance results (unit layer)
        run: node scripts/check-acceptance-results.mjs --layer unit acceptance-results/unit.jsonl

  acceptance-ids:
    name: acceptance-ids
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/check-acceptance-ids.mjs

  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      BROWSER: ${{ matrix.browser }}
      # 建置與測試讀同一個值（spec.md 第 11 節）。PR 用 head commit，不用 GITHUB_SHA
      # （pull_request 事件的 GITHUB_SHA 是合併 commit）
      BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Playwright 瀏覽器快取（spec.md 12.7.4）：路徑在工作目錄之外；鍵含 package-lock.json 的雜湊，
      # 不設前綴還原鍵（只採用完全相同的鍵）。命中時 install 仍執行，任何步驟都不以快取是否命中為條件
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      # macOS 不需系統相依套件，只安裝瀏覽器本身
      - timeout-minutes: 1
        run: |
          sleep 90
          npx playwright install "$BROWSER"
      - name: build
        run: node scripts/build.mjs
      # 兩次執行各自以自訂 reporter 輸出結果檔（playwright.config.mjs；spec.md 12.2.1）
      - name: e2e
        env:
          CI: 'true'
          ACCEPTANCE_RESULTS_FILE: acceptance-results/e2e.jsonl
        run: npx playwright test --project="$BROWSER"
      - name: e2e realtime (NFR-6)
        env:
          CI: 'true'
          ACCEPTANCE_RESULTS_FILE: acceptance-results/e2e-realtime.jsonl
        run: npx playwright test --project="$BROWSER-realtime" --workers=1
      - name: acceptance results (e2e layer)
        run: node scripts/check-acceptance-results.mjs --layer e2e acceptance-results/e2e.jsonl acceptance-results/e2e-realtime.jsonl

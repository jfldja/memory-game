<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>牌面草稿預覽</title>
<style>
:root { --bg: #F4F1EA; --fg: #1A1A1A; --card: #FFFFFF; --muted: #5A5A5A; }
@media (prefers-color-scheme: dark) { :root { --bg: #15181F; --fg: #ECECEC; --card: #FFFFFF; --muted: #A8A8A8; } }
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans CJK TC", sans-serif; }
h1 { font-size: 1.4rem; margin: 0 0 4px; }
h2 { font-size: 1.1rem; margin: 24px 0 8px; }
p { color: var(--muted); margin: 4px 0 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.card { margin: 0; }
.face { background: var(--card); border-radius: 10px; padding: 8px; aspect-ratio: 1; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.face svg { width: 100%; height: 100%; display: block; }
figcaption { font-size: .85rem; margin-top: 4px; display: flex; flex-direction: column; }
figcaption span { color: var(--muted); }
.mini { display: flex; flex-wrap: wrap; gap: 8px; }
.m { width: 108px; height: 108px; background: var(--card); border-radius: 8px; padding: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.m svg { width: 100%; height: 100%; display: block; }
</style>
</head>

<h1>翻牌記憶遊戲：牌面草稿（設計階段）</h1>
<p>18 種牌面＋1 張牌背，全部為本專案原創的內嵌 SVG，不載入任何外部資源。屬性值見 card-attributes.json。第 1～3 節每個 svg 的 id 即牌面識別碼；最小尺寸模擬區的副本不帶 id。</p>
